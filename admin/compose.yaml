services:
  fiscal-admin:
    build: .
    image: fiscal-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3120:3120"
    environment:
      ORIGIN: https://fiscal.byescaleira.com
      RP_ID: fiscal.byescaleira.com
      BRIDGE_URL: http://fiscal-bridge:3111
      BRIDGE_ADMIN_TOKEN: ${BRIDGE_ADMIN_TOKEN:?BRIDGE_ADMIN_TOKEN is required}
      CLOUDKIT_KEY_ID: ${CLOUDKIT_KEY_ID:-}
      CLOUDKIT_KEY_ID_DEVELOPMENT: ${CLOUDKIT_KEY_ID_DEVELOPMENT:-}
      CLOUDKIT_KEY_ID_PRODUCTION: ${CLOUDKIT_KEY_ID_PRODUCTION:-}
    volumes:
      - ./secrets:/secrets
      - ./data:/data
    networks:
      - default
      - control
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3120/admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  control:
    name: fiscal-control
    external: true
