services:
  fiscal-api:
    build: .
    image: fiscal-api
    container_name: fiscal-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3130:3130"
    environment:
      APNS_KEY_ID: ${APNS_KEY_ID:?APNS_KEY_ID is required}
      APNS_TEAM_ID: ${APNS_TEAM_ID:?APNS_TEAM_ID is required}
      APNS_TOPIC: ${APNS_TOPIC:?APNS_TOPIC is required (bundle id + .push-type.liveactivity)}
      POLL_INTERVAL: ${POLL_INTERVAL:-20s}
      SIMULATE: ${SIMULATE:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      HIGHLIGHT_ALERTS: ${HIGHLIGHT_ALERTS:-1}
      APNS_DISABLED: ${APNS_DISABLED:-}
      TSE_BASE_URL: ${TSE_BASE_URL:-https://resultados.tse.jus.br/oficial/ele2026}
    volumes:
      - ./data:/data
      - ./public:/public
      - ./secrets:/secrets:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/liveresults-server", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  fiscal-ingest:
    build: .
    image: fiscal-api
    container_name: fiscal-ingest
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/fiscal-ingest"]
    environment:
      DATA_DIR: /data
      GOMEMLIMIT: ${GOMEMLIMIT:-3GiB}
      PUBLIC_DIR: /public
      INGEST_YEARS: ${INGEST_YEARS:-}
      INGEST_UFS: ${INGEST_UFS:-}
      INGEST_SOURCES: ${INGEST_SOURCES:-}
      TSE_YEARS: ${TSE_YEARS:-2022,2026}
      TSE_CANDIDATE_YEARS: ${TSE_CANDIDATE_YEARS:-2018}
      INGEST_FULL_AT: ${INGEST_FULL_AT:-06:30}
      INGEST_LIVE_INTERVAL: ${INGEST_LIVE_INTERVAL:-10m}
      INGEST_WORKERS: ${INGEST_WORKERS:-12}
      INGEST_REQUEST_GAP: ${INGEST_REQUEST_GAP:-150ms}
      STORE_PATH: /data/fiscal.db
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./ingest-data:/data
      - ./ingest-backups:/data/backups
      - ./public:/public
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 3584m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "/usr/local/bin/fiscal-ingest", "-check"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30m
